name: Deploy Berg Athos Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Erlaubt dem Workflow, die GitHub Pages Bereitstellung durchzuführen
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment erlauben
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Da dies eine native Web-App ist, wird direkt der Hauptordner veröffentlicht
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
